{% extends "core/base.html" %}

{% block titulo %}Contraseña Actualizada{% endblock %}

{% block contenido %}
<section class="login-seccion">
  <div class="contenedor" style="max-width: 520px; text-align: center; padding: 40px 20px;">
    <div class="login-tarjeta">
      <h1 class="login-titulo">¡Contraseña Cambiada!</h1>
      <p style="margin: 18px 0; color: var(--texto-base);">
        Tu contraseña ha sido actualizada con éxito. Ya puedes acceder a tu cuenta con tus nuevas credenciales.
      </p>
      <div style="margin-top: 25px;">
        <a href="{% url 'login' %}" class="boton boton--primario">Iniciar Sesión Ahora</a>
      </div>
    </div>
  </div>
</section>
{% endblock %}
